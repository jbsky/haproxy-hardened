# Configuration livree dans l'image : un point de depart sur et testable, pas
# une configuration de production. La vraie se monte en lecture seule sur
# /usr/local/etc/haproxy/ (et peut garder ou non le monitor-uri ci-dessous,
# que le healthcheck de l'image interroge : HAPROXY_HEALTH_URL pour un autre).
global
    log stdout format raw local0 info
    # Sockets et etat dans /run/haproxy (tmpfs en rootfs lecture seule).
    stats socket /run/haproxy/admin.sock mode 600 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Healthcheck de l'image (init --healthcheck) : boucle locale uniquement.
frontend healthz
    bind 127.0.0.1:8405
    monitor-uri /healthz

# Port non privilegie : l'image tourne en uid 4430 sans capacite. Pour 80/443,
# accorder NET_BIND_SERVICE au conteneur (cap_add), pas a l'image.
frontend http
    bind :8080
    http-request return status 200 content-type text/plain string "haproxy-hardened\n"
