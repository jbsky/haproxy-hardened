# security-audit -- audit hebdomadaire de l'image publiee (gabarit hardened-ci).
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@fdb4a4afabae12204969c3123bdfc13b50d2808b # v1.4.11
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
