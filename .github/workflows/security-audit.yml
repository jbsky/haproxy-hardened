# security-audit -- audit hebdomadaire de l'image publiee (gabarit hardened-ci).
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@9e74542600950c7d867fbced44daa16a14db7099 # v1.4.13
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
