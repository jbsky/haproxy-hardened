# security-audit -- audit hebdomadaire de l'image publiee (gabarit hardened-ci).
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@78163b0f20b2edfa0d5f5c5d92a675b0d3198b15 # v1.4.12
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
