# security-audit -- audit hebdomadaire de l'image publiee (gabarit hardened-ci).
name: security-audit

on:
  schedule:
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: jbsky/hardened-ci/.github/workflows/security-audit.yml@20dbd2ae1f65f1d72d88ec7a3c78ed716ba2009e # v1.2.0
    permissions:
      contents: read
      packages: read
      security-events: write
      issues: write
